<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFT Stars Casino</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 0;
      display: flex; justify-content: center;
      min-height: 100vh;
    }
    .game-container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
    
    /* СТИЛЬ ЖИДКОЕ СТЕКЛО (GLASSMORPHISM) */
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* БЛОК ПРОФИЛЯ */
    .profile-header { display: flex; align-items: center; text-align: left; margin-bottom: 15px; }
    .avatar { width: 50px; height: 50px; border-radius: 50px; background-size: cover; background-position: center; background-color: #248bcf; margin-right: 15px; border: 2px solid rgba(255,255,255,0.2); }
    .user-info h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .user-info p { margin: 2px 0 0 0; font-size: 12px; color: #8a85a5; }

    .balance-badge {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.05); padding: 12px 20px; border-radius: 16px;
      font-size: 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.05);
    }
    .star-icon { color: #fcc419; font-size: 18px; margin-right: 6px; }

    /* РУЛЕТКА КЕЙСОВ */
    .roulette-wrapper {
      position: relative; width: 100%; height: 90px; margin: 25px 0;
      background: rgba(0, 0, 0, 0.4); border-radius: 20px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .roulette-pointer {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 4px; height: 100%; background: #ff4b72; z-index: 10; box-shadow: 0 0 12px #ff4b72;
    }
    .roulette-tape { display: flex; width: max-content; height: 100%; transform: translateX(0); }
    .gift-item {
      width: 90px; height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 10px; font-weight: bold; border-right: 1px solid rgba(255,255,255,0.05);
    }

    /* КНОПКА СВЕЧЕНИЯ */
    .glow-btn {
      background: linear-gradient(90deg, #248bcf, #1a6fa7); color: white; border: none;
      padding: 18px; font-size: 16px; font-weight: bold; border-radius: 18px; width: 100%;
      cursor: pointer; box-shadow: 0 0 20px rgba(36, 139, 207, 0.4); transition: 0.2s;
    }
    .glow-btn:active { transform: scale(0.98); opacity: 0.9; }

    /* ИНВЕНТАРЬ */
    .inventory-section { text-align: left; }
    .inventory-section h3 { font-size: 15px; color: #8a85a5; margin-bottom: 12px; font-weight: 600; }
    .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .inventory-item {
      background: rgba(255,255,255,0.03); padding: 15px 5px; border-radius: 14px;
      font-size: 10px; text-align: center; font-weight: bold; border: 1px solid rgba(255,255,255,0.05);
    }
    .empty-text { grid-column: span 3; color: #524f66; text-align: center; font-size: 13px; padding: 15px 0; }

    /* РЕДКОСТИ ГРАДИЕНТЫ */
    .common { background: linear-gradient(135deg, rgba(60,60,60,0.3), rgba(80,80,80,0.3)) !important; }
    .rare { background: linear-gradient(135deg, rgba(26,54,93,0.4), rgba(42,67,101,0.4)) !important; border-color: #3182ce !important; }
    .epic { background: linear-gradient(135deg, rgba(76,29,149,0.4), rgba(91,33,182,0.4)) !important; border-color: #805ad5 !important; }
    .legendary { background: linear-gradient(135deg, rgba(116,66,16,0.4), rgba(151,90,22,0.4)) !important; border-color: #dd6b20 !important; color: #fbd38d; }
  </style>
</head>
<body>
  <div class="game-container">
    
    <!-- ПРОФИЛЬ СТЕКЛО -->
    <div class="glass-panel">
      <div class="profile-header">
        <div class="avatar" id="user-avatar"></div>
        <div class="user-info">
          <h2 id="user-name">Игрок</h2>
          <p id="user-status">⚡ Premium Пользователь</p>
        </div>
      </div>
      <div class="balance-badge">
        <span>Баланс:</span>
        <div><span class="star-icon">⭐</span><span id="balance-value">...</span></div>
      </div>
    </div>

    <!-- ИГРА КЕЙСЫ -->
    <div class="glass-panel">
      <div class="roulette-wrapper">
        <div class="roulette-pointer"></div>
        <div class="roulette-tape" id="case-tape">
          <div class="gift-item common">🎁 Common</div>
          <div class="gift-item rare">💎 Rare Code</div>
          <div class="gift-item epic">🔥 Epic NFT</div>
          <div class="gift-item legendary">👑 ЛЕГЕНДА</div>
        </div>
      </div>
      <button class="glow-btn" id="spin-button">🎁 Открыть кейс (100 ⭐)</button>
    </div>

    <!-- ИНВЕНТАРЬ СТЕКЛО -->
    <div class="glass-panel inventory-section">
      <h3>🎒 Твой инвентарь подарков</h3>
      <div class="inventory-grid" id="inventory-list">
        <div class="empty-text">Инвентарь пуст. Открой первый кейс!</div>
      </div>
    </div>

  </div>

  <!-- ТОЧНЫЙ ПУТЬ К ТВОЕМУ ФАЙЛУ В ПАПКЕ JS -->
  <script src="./js/index.js"></script>
</body>
</html>
