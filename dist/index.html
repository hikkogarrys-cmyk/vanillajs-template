<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFT Cases & Stars</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 0; display: flex; justify-content: center;
    }
    .game-container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
    .balance-block {
      background: rgba(255, 255, 255, 0.07); padding: 10px 24px; border-radius: 50px;
      display: inline-block; font-size: 18px; font-weight: bold; margin-bottom: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .star-icon { color: #fcc419; margin-right: 4px; }
    .roulette-wrapper {
      position: relative; width: 240px; height: 80px; margin: 0 auto 40px auto;
      background: #1a1a1a; border: 2px solid #333; border-radius: 16px; overflow: hidden;
    }
    .roulette-pointer {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 3px; height: 100%; background: #ff4b4b; z-index: 10;
    }
    .roulette-tape { display: flex; width: max-content; height: 100%; transform: translateX(0); }
    .gift-item {
      width: 80px; height: 100%; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: bold; border-right: 1px solid #2a2a2a;
    }
    .open-btn {
      background: #248bcf; color: white; border: none; padding: 16px;
      font-size: 16px; font-weight: bold; border-radius: 14px; width: 100%; cursor: pointer;
    }
    .open-btn:disabled { background: #444; color: #888; }
    .inventory-section { margin-top: 40px; text-align: left; }
    .inventory-section h3 { font-size: 16px; color: #aaa; margin-bottom: 15px; }
    .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .inventory-item {
      background: #1e1e1e; padding: 14px 4px; border-radius: 12px;
      font-size: 10px; text-align: center; font-weight: bold; border: 1px solid #2a2a2a;
    }
    .empty-text { grid-column: span 3; color: #666; text-align: center; font-size: 13px; }
    .common { background: #2c2c2c !important; }
    .rare { background: #1a365d !important; border: 1px solid #3182ce !important; }
    .epic { background: #4c1d95 !important; border: 1px solid #805ad5 !important; }
    .legendary { background: #744210 !important; border: 1px solid #dd6b20 !important; color: #fbd38d !important; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="balance-block">
      <span class="star-icon">⭐</span>
      <span id="balance-value">1000</span> Stars
    </div>

    <div class="roulette-wrapper">
      <div class="roulette-pointer"></div>
      <div class="roulette-tape" id="case-tape">
        <div class="gift-item common">🎁 Обычный NFT</div>
        <div class="gift-item rare">💎 Редкий Код</div>
        <div class="gift-item epic">🔥 Эпик Скин</div>
        <div class="gift-item legendary">👑 ЛЕГЕНДА</div>
      </div>
    </div>

    <button class="open-btn" id="spin-button">🎁 Открыть кейс (100 ⭐)</button>

    <div class="inventory-section">
      <h3>🎒 Твой инвентарь подарков</h3>
      <div class="inventory-grid" id="inventory-list">
        <div class="empty-text">Пока тут пусто. Открой свой первый кейс!</div>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
  <script src="js/initNavigrator.js"></script>
  <script src="js/initComponents.js"></script>
  <script src="js/initTonConnect.js"></script>

  <script src="js/components/DisplayData.js"></script>
  <script src="js/components/Link.js"></script>
  <script src="js/components/Page.js"></script>
  <script src="js/components/RGB.js"></script>
  <script src="js/components/TonConnectButton.js"></script>
  <script src="js/components/WalletProvider.js"></script>
  <script src="js/components/PageComponent.js"></script>

  <script src="js/pages/HomePage.js"></script>
  <script src="js/pages/InitDataPage.js"></script>
  <script src="js/pages/LaunchParamsPage.js"></script>
  <script src="js/pages/ThemeParamsPage.js"></script>
  <script src="js/pages/TonConnectPage.js"></script>

  <script src="js/index.js"></script>
</body>
</html>
